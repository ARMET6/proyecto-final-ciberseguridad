{% extends "base.html" %}{% block contenido %}
<h3>Tablón de avisos</h3>
<form method="post"><textarea name="contenido" rows="3" cols="60"></textarea><br><button>Publicar</button></form>
{% for a in avisos %}
{# VULNERABLE (XSS almacenado): el contenido guardado se presenta como HTML #}
<div class="aviso"><strong>{{ a['autor'] }}</strong> · {{ a['fecha'] }}<br>{{ a['contenido']|safe }}</div>
{% endfor %}{% endblock %}

<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Portal Escolar · Campus Las Torres (laboratorio)</title>
<style>body{font-family:system-ui,sans-serif;max-width:820px;margin:30px auto;padding:0 16px;color:#14231f}
header{border-bottom:3px solid #0b6e5c;margin-bottom:18px}nav a{margin-right:12px}
table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:6px 10px;text-align:left}
.aviso{border:1px solid #ccc;border-radius:6px;padding:8px 12px;margin:8px 0}.err{color:#a00}
.lab{background:#fff1dc;padding:6px 10px;border-radius:4px;font-size:.9em}code{background:#eee;padding:2px 4px}</style></head>
<body><header><h2>Portal Escolar · Campus Las Torres</h2>
<p class="lab">Entorno de laboratorio con datos ficticios · versión {{ version }}</p>
{% if u %}<nav><a href="/">Inicio</a><a href="/buscar">Buscar alumnos</a><a href="/avisos">Avisos</a>
<a href="/logout">Salir ({{ u['usuario'] }})</a></nav>{% endif %}</header>
{% block contenido %}{% endblock %}</body></html>

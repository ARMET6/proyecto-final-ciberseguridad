<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Portal Escolar · Campus Las Torres (laboratorio)</title>
<link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}"></head>
<body><header><h2>Portal Escolar · Campus Las Torres</h2>
<p class="lab">Entorno de laboratorio con datos ficticios · versión {{ version }}</p>
{% if u %}<nav><a href="/">Inicio</a>
{% if u['rol'] in ('docente', 'escolares') %}<a href="/buscar">Buscar alumnos</a>{% endif %}
<a href="/avisos">Avisos</a>
{% if u['rol'] == 'admin' %}<a href="/admin/usuarios">Usuarios</a>{% endif %}
<form method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Salir ({{ u['usuario'] }})</button></form>
</nav>{% endif %}</header>
{% block contenido %}{% endblock %}</body></html>
